apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telegram-repeater-bot.fullname" . }}
  labels:
    {{- include "telegram-repeater-bot.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64-encoded Telegram bot token.
  # Supply via: --set secret.tokenBase64=$(echo -n "YOUR_TOKEN" | base64)
  BOT__TOKEN: {{ .Values.secret.tokenBase64 | quote }}
