# Default values for telegram-repeater-bot.
# Override with -f my-values.yaml or --set key=value.

replicaCount: 1

image:
  repository: your-registry/telegram-repeater-bot
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Bot non-secret configuration
bot:
  inputChatId: "0"   # set to the real chat ID
  outputChatId: "0"  # set to the real chat ID
  outputTopicId: "0"   # set to the real topic ID

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}

serviceAccount:
  create: false
  name: ""
